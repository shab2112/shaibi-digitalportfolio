<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="The Idea Stock">
  <title>The Idea Stock</title>
  <!--
    A stack of layers. It reads as "stock" (a store of ideas) and as the layered
    view of an AI system the whole site is organised around: the top face is the
    layer in focus, the two below are the ones beneath it.

    Depth comes from three distinct shades rather than opacity, so the lower
    layers stay visible on a light background as well as a dark one.
  -->
  <defs>
    <linearGradient id="tis-face" x1="6" y1="7" x2="42" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eeccf" />
      <stop offset="1" stop-color="#2bb99e" />
    </linearGradient>
  </defs>
  <path d="M24 7 42 16 24 25 6 16Z" fill="url(#tis-face)" />
  <path d="M6 23 24 32 42 23" fill="none" stroke="#2bb99e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M6 31 24 40 42 31" fill="none" stroke="#1b8672" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
